<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>훈련 결과 카드 | SwimMate</title>
  <meta name="description" content="SwimMate에서 만든 개인정보 최소화 월간 수영 훈련 결과 카드입니다.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="나의 월간 수영 결과 | SwimMate">
  <meta property="og:description" content="거리·횟수·영법과 개인 최고기록으로 확인하는 이번 달 수영 성장">
  <meta property="og:image" content="https://swimtech.vercel.app/static/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js" defer></script>
  <style>
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-wrap:anywhere}
    .share-shell{width:min(980px,calc(100% - 32px));margin:0 auto;padding:34px 0 64px}
    .share-intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}
    .eyebrow{color:var(--cyan);font-weight:900;font-size:var(--fs-caption);letter-spacing:.08em;text-transform:uppercase}
    h1{margin:6px 0 0;font-size:clamp(28px,5vw,48px);line-height:1.08;font-style:italic}
    .result-card{position:relative;overflow:hidden;min-height:660px;padding:clamp(24px,5vw,54px);border:1px solid rgba(72,202,228,.3);border-radius:32px;background:radial-gradient(circle at 88% 9%,rgba(72,202,228,.24),transparent 30%),linear-gradient(145deg,#07334d,#081d2b 62%,#04151f);box-shadow:0 28px 80px rgba(0,0,0,.35);color:#eefcff}
    .result-card:after{content:"";position:absolute;right:-90px;bottom:-120px;width:360px;height:360px;border:46px solid rgba(0,180,216,.1);border-radius:50%}
    .card-head,.card-main,.metric-grid,.stroke-wrap,.card-foot{position:relative;z-index:1}
    .card-head{display:flex;align-items:start;justify-content:space-between;gap:16px}
    .card-brand{font-size:22px;font-weight:1000;color:#48cae4}.card-owner{margin-top:8px;color:#a8d6e2;font-size:16px}
    .card-period{text-align:right;color:#48cae4;font-weight:800}
    .card-main{margin:70px 0 42px}.card-kicker{color:#8ac8da;font-size:16px;font-weight:700}.card-distance{font-size:clamp(62px,13vw,122px);font-style:italic;font-weight:1000;line-height:.9;letter-spacing:-.06em;color:#fff}.card-distance span{font-size:.28em;color:#48cae4;letter-spacing:0}
    .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(0,0,0,.16)}.metric strong{display:block;font-size:clamp(24px,4vw,36px);font-style:italic;color:#48cae4}.metric span{display:block;margin-top:5px;color:#9bcbd8;font-size:13px}
    .stroke-wrap{margin-top:30px;padding-top:24px;border-top:1px solid rgba(255,255,255,.12)}.stroke-title{font-size:13px;color:#8ac8da;margin-bottom:12px}.stroke-list{display:flex;gap:9px;flex-wrap:wrap}.stroke-chip{padding:8px 12px;border-radius:999px;background:rgba(72,202,228,.1);border:1px solid rgba(72,202,228,.2);font-weight:700;font-size:13px}
    .card-foot{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-top:50px}.privacy{max-width:550px;color:#83b5c4;font-size:12px;line-height:1.6}.made{font-weight:900;white-space:nowrap}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:800;cursor:pointer}.btn.primary{border:0;background:var(--cyan);color:#03202b}.btn:disabled{opacity:.55;cursor:not-allowed}
    .notice{margin-top:16px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;color:var(--muted);line-height:1.6}.error{padding:42px;text-align:center;border:1px solid var(--border);border-radius:22px;background:var(--surface)}
    canvas{display:none}
    @media(max-width:700px){.share-shell{width:min(100% - 20px,980px);padding-top:20px}.share-intro{align-items:start;flex-direction:column}.result-card{min-height:0;border-radius:22px;padding:24px}.card-main{margin:48px 0 30px}.metric-grid{grid-template-columns:repeat(2,1fr)}.card-foot{align-items:start;flex-direction:column}.actions .btn{flex:1 1 calc(50% - 8px)}.card-period{font-size:13px}}
  </style>
</head>
<body>
  <main class="share-shell">
    <div class="share-intro">
      <div><div class="eyebrow">SwimMate Result Card</div><h1>나의 수영 성장을 공유해요</h1></div>
    </div>
    <section class="result-card" id="result-card" aria-live="polite">
      <div class="card-head"><div><div class="card-brand">SwimMate</div><div class="card-owner" id="owner">수영 훈련 기록</div></div><div class="card-period" id="period">불러오는 중</div></div>
      <div class="card-main"><div class="card-kicker">이번 달 누적 거리</div><div class="card-distance" id="distance">—<span>m</span></div></div>
      <div class="metric-grid">
        <div class="metric"><strong id="sessions">—</strong><span>훈련 횟수</span></div>
        <div class="metric"><strong id="average">—</strong><span>평균 거리</span></div>
        <div class="metric"><strong id="growth">—</strong><span>전월 대비</span></div>
        <div class="metric"><strong id="pb">—</strong><span>새 개인 최고기록</span></div>
      </div>
      <div class="stroke-wrap"><div class="stroke-title">영법별 누적 거리</div><div class="stroke-list" id="strokes"></div></div>
      <div class="card-foot"><div class="privacy" id="privacy">개인정보를 제외한 월간 합계만 표시합니다.</div><div class="made">Made with SwimMate</div></div>
    </section>
    <div class="actions" id="actions">
      <button class="btn primary" id="download" type="button">PNG 저장</button>
      <button class="btn" id="share" type="button">공유하기</button>
      <button class="btn" id="copy" type="button">링크 복사</button>
      <a class="btn" href="/login" style="display:inline-flex;align-items:center;text-decoration:none">SwimMate 체험</a>
    </div>
    <div class="notice">이 카드는 생성 시점의 월간 합계를 보관한 스냅샷입니다. 작성자가 공유를 해제하거나 유효기간이 끝나면 더 이상 열리지 않습니다.</div>
    <canvas id="share-canvas" width="1080" height="1350"></canvas>
  </main>
<script>
  'use strict';
  const token=new URLSearchParams(location.search).get('token')||location.pathname.split('/').filter(Boolean).pop();
  let payload=null;
  const fmt=value=>Number(value||0).toLocaleString('ko-KR');
  const strokeNames={freestyle:'자유형',backstroke:'배영',breaststroke:'평영',butterfly:'접영',other:'기타'};
  function render(data){payload=data;const r=data.result||{};document.getElementById('owner').textContent=data.display_name?`${data.display_name}님의 수영 기록`:'수영 훈련 기록';document.getElementById('period').textContent=`${r.year}년 ${r.month}월`;document.getElementById('distance').innerHTML=`${fmt(r.total_distance)}<span>m</span>`;document.getElementById('sessions').textContent=`${fmt(r.total_count)}회`;document.getElementById('average').textContent=`${fmt(r.avg_distance)}m`;const growth=Number(r.growth_rate||0);document.getElementById('growth').textContent=`${growth>0?'+':''}${growth}%`;document.getElementById('pb').textContent=`${fmt((r.benchmark_performance||{}).personal_bests)}회`;document.getElementById('privacy').textContent=data.privacy;const entries=Object.entries(r.by_stroke||{}).filter(([,v])=>Number(v)>0).sort((a,b)=>b[1]-a[1]);document.getElementById('strokes').innerHTML=entries.length?entries.map(([k,v])=>`<span class="stroke-chip">${strokeNames[k]||'기타'} ${fmt(v)}m</span>`).join(''):'<span class="stroke-chip">영법 분류 없음</span>';}
  async function load(){try{const res=await fetch(`/api/promotion/public/results/${encodeURIComponent(token)}`);if(!res.ok)throw new Error(res.status===410?'공유가 종료된 카드입니다.':'결과 카드를 찾을 수 없습니다.');render(await res.json());}catch(error){document.getElementById('result-card').outerHTML=`<div class="error"><h2>${error.message}</h2><p>링크가 정확한지 확인하거나 카드 작성자에게 새 링크를 요청해 주세요.</p></div>`;document.getElementById('actions').hidden=true;}}
  function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();}
  function makeCanvas(){if(!payload)return null;const r=payload.result,c=document.getElementById('share-canvas'),x=c.getContext('2d');const g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#073b56');g.addColorStop(.65,'#071f2d');g.addColorStop(1,'#04141d');x.fillStyle=g;x.fillRect(0,0,1080,1350);x.strokeStyle='rgba(72,202,228,.25)';x.lineWidth=2;x.beginPath();x.arc(980,160,250,0,Math.PI*2);x.stroke();x.fillStyle='#48cae4';x.font='900 44px Arial,sans-serif';x.fillText('SwimMate',70,95);x.textAlign='right';x.font='700 30px Arial,sans-serif';x.fillText(`${r.year}년 ${r.month}월`,1010,95);x.textAlign='left';x.fillStyle='#9dcbd8';x.font='600 28px Arial,sans-serif';x.fillText(payload.display_name?`${payload.display_name}님의 월간 수영`:'월간 수영 훈련 기록',70,195);x.fillStyle='#fff';x.font='italic 900 138px Arial,sans-serif';x.fillText(fmt(r.total_distance),65,390);const width=x.measureText(fmt(r.total_distance)).width;x.fillStyle='#48cae4';x.font='800 42px Arial,sans-serif';x.fillText('m',80+width,390);x.fillStyle='#8fc5d4';x.font='700 25px Arial,sans-serif';x.fillText('이번 달 누적 거리',70,440);const metrics=[[`${fmt(r.total_count)}회`,'훈련 횟수'],[`${fmt(r.avg_distance)}m`,'평균 거리'],[`${Number(r.growth_rate)>0?'+':''}${Number(r.growth_rate||0)}%`,'전월 대비'],[`${fmt((r.benchmark_performance||{}).personal_bests)}회`,'새 PB']];metrics.forEach((m,i)=>{const col=i%2,row=Math.floor(i/2),mx=70+col*480,my=520+row*170;roundRect(x,mx,my,440,140,24,'rgba(0,0,0,.18)');x.fillStyle='#48cae4';x.font='italic 900 48px Arial,sans-serif';x.fillText(m[0],mx+25,my+62);x.fillStyle='#9dcbd8';x.font='600 23px Arial,sans-serif';x.fillText(m[1],mx+25,my+104);});x.fillStyle='#9dcbd8';x.font='700 24px Arial,sans-serif';x.fillText('영법별 누적 거리',70,930);let sy=985;Object.entries(r.by_stroke||{}).filter(([,v])=>Number(v)>0).sort((a,b)=>b[1]-a[1]).slice(0,5).forEach(([k,v],i)=>{x.fillStyle=i===0?'#fff':'#c4e2ea';x.font=i===0?'800 30px Arial,sans-serif':'600 27px Arial,sans-serif';x.fillText(`${strokeNames[k]||'기타'}  ${fmt(v)}m`,70+(i%2)*470,sy+Math.floor(i/2)*58);});x.fillStyle='#72aebe';x.font='500 20px Arial,sans-serif';x.fillText('위치 · 심박 · 메모 · 원본 스크린샷은 포함되지 않습니다.',70,1250);x.textAlign='right';x.fillStyle='#fff';x.font='900 27px Arial,sans-serif';x.fillText('Made with SwimMate',1010,1250);x.textAlign='left';return c;}
  function canvasBlob(){return new Promise(resolve=>makeCanvas().toBlob(resolve,'image/png',1));}
  document.getElementById('download').addEventListener('click',async()=>{const blob=await canvasBlob();if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`SwimMate_${payload.result.year}_${String(payload.result.month).padStart(2,'0')}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
  document.getElementById('copy').addEventListener('click',async event=>{await navigator.clipboard.writeText(location.href);event.currentTarget.textContent='복사 완료';});
  document.getElementById('share').addEventListener('click',async()=>{const blob=await canvasBlob();const file=new File([blob],'swimmate-result.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'나의 SwimMate 수영 기록',text:'이번 달 수영 기록을 공유합니다.',url:location.href,files:[file]});}else if(navigator.share){await navigator.share({title:'나의 SwimMate 수영 기록',url:location.href});}else{await navigator.clipboard.writeText(location.href);alert('공유 링크를 복사했습니다.');}});
  load();
</script>
</body>
</html>
